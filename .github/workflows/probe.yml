name: probe
on:
  workflow_dispatch:
    inputs:
      addr:
        required: true
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/probe.mjs
        env:
          ADDR: ${{ inputs.addr }}
