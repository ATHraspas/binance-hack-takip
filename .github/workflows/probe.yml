name: probe
on:
  workflow_dispatch:
    inputs:
      addr:
        required: true
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: mkdir out && node .github/probe.mjs > out/probe.json
        env:
          ADDR: ${{ inputs.addr }}
      - run: |
          cd out && git init -q -b probe && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -q -m probe && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
