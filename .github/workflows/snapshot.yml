name: snapshot
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright-core@1.47.2
      - run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 1
          node .github/snap.mjs
      - name: data dalına yaz
        run: |
          mkdir out && mv snapshot.json out/
          cd out
          git init -q -b data
          git config user.name "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshot.json
          git commit -q -m "snapshot $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
